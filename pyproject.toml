[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "1.0.0"
description = "Find, tailor and submit job applications across LinkedIn, company ATS boards and job aggregators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.4"]
all = ["anthropic>=0.40", "playwright>=1.40", "pytest>=7.4"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
include = ["jobagent*"]

[tool.setuptools.package-data]
jobagent = ["config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
